services:
  - type: web
    name: chunki-chip
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_ENV
        value: production
      - key: SHIPPO_API_TOKEN
        sync: false
      - key: SHIPPO_PACKAGES_JSON
        sync: false
      - key: CHECKOUT_REDIRECT_URL
        value: https://chunkichip.com/success
