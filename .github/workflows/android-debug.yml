name: Android debug build
on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read

jobs:
  android:
    if: github.ref == 'refs/heads/mobile-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer in the SDK repository.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies
        run: npm ci
      - name: Test mobile catalog
        run: npm test
      - name: Build mobile web assets
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build Android debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug lintDebug --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          retention-days: 30
          name: chunki-chip-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
